name: Build Astro Sudan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev build-essential \
            libltdl-dev

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug
        env:
          ANDROID_SDK_ACCEPT_LICENSES: "y"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-sudan-apk
          path: bin/*.apk
